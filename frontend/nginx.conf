server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /admin/ { try_files $uri $uri/ /admin/index.html; }
    location / { try_files $uri $uri/ /index.html; }

    location ~* \.(?:css|js|svg|ico|png|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}

